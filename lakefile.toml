name = "coarse"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Coarse"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Blueprint extraction; used only by the `CoarseBlueprint` library.
[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "v4.36.0-rc1"

# Last, so that Mathlib's versions of shared dependencies (batteries) take precedence.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "10dc7882b0311638b63e9aad5506f2cfcf4e61b8"

[[lean_lib]]
name = "Coarse"

[[lean_lib]]
name = "CoarseBlueprint"
