name: CI

# The steps of `make check`: build both libraries with warnings other than sorry as errors, check
# the root import files and render the web blueprint. On main, CI also builds the API documentation
# and publishes both to GitHub Pages: the blueprint at the root, the API documentation at /docs.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
      - name: Build Coarse and CoarseBlueprint
        run: python3 scripts/build_check.py
      - name: Check the root import files
        run: lake exe mk_all --check --lib Coarse
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # plasTeX finds the files of `\input` with `kpsewhich`, from TeX Live; without it, it finds
      # only files of the current directory, not `chapters/…` or the extracted Lean nodes.
      - name: Install leanblueprint
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev texlive-base
          pip install leanblueprint==0.0.20
      # plasTeX only warns about a missing file and renders the rest, so the step fails on the
      # warning instead of publishing a blueprint without its chapters.
      - name: Extract and render the web blueprint
        shell: bash
        run: |
          make web SOURCE=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }} \
            2>&1 | tee web.log
          ! grep 'File not found' web.log
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: blueprint
          path: blueprint/web

  docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
      # The documentation of the Mathlib modules that the library imports changes only with the
      # dependencies; Lake redoes the library's own modules.
      - uses: actions/cache@v4
        with:
          path: docbuild/.lake
          key: docs-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lakefile.toml') }}
      - name: Build the API documentation
        run: make docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docbuild/.lake/build/doc

  deploy:
    needs: [build, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blueprint
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: site/docs
      # Artifacts of earlier attempts stay in the run, so the name carries the attempt number: a
      # re-run would otherwise find two artifacts named `github-pages` and fail.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
